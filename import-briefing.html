<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cara dlí — Briefing Importer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 50px auto;
      padding: 20px;
      background: #f7f4ed;
      color: #173f35;
    }

    h1 {
      font-family: Georgia, serif;
    }

    .box {
      background: white;
      padding: 24px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-top: 20px;
    }

    button {
      background: #173f35;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      margin-top: 15px;
    }

    button:hover {
      opacity: 0.9;
    }

    textarea {
      width: 100%;
      height: 350px;
      margin-top: 20px;
      font-family: monospace;
      font-size: 12px;
      box-sizing: border-box;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }

    input {
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <h1>cara dlí — Briefing Importer</h1>

  <div class="box">
    <p>
      Select the JSON briefing file generated by ChatGPT.
      This tool converts it into one SQL script for Supabase.
    </p>

    <input type="file" id="jsonFile" accept=".json">

    <br>

    <button onclick="generateSQL()">Generate Supabase Import</button>

    <div id="status"></div>

    <textarea id="sqlOutput" placeholder="Your SQL import will appear here..."></textarea>

    <button onclick="copySQL()">Copy SQL</button>
  </div>

<script>

function escapeSQL(value) {
  if (value === null || value === undefined) {
    return "NULL";
  }

  return "'" + String(value)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "''")
    .replace(/\r?\n/g, "\\n")
    + "'";
}

async function generateSQL() {

  const fileInput = document.getElementById("jsonFile");
  const status = document.getElementById("status");
  const output = document.getElementById("sqlOutput");

  if (!fileInput.files.length) {
    status.textContent = "Please select the JSON file first.";
    return;
  }

  try {

    const text = await fileInput.files[0].text();
    const data = JSON.parse(text);

    const b = data.briefing;

    let sql = "";

    sql += "-- cara dlí briefing import\n";
    sql += "-- Generated automatically from JSON\n\n";

    /*
      BRIEFING
    */

    sql += "-- Briefing\n";

    sql += `
INSERT INTO briefings (id, issue, publication_date, title)
VALUES (
  ${Number(b.id)},
  ${Number(b.issue)},
  ${escapeSQL(b.publication_date)},
  ${escapeSQL(b.title)}
)
ON CONFLICT (id)
DO UPDATE SET
  issue = EXCLUDED.issue,
  publication_date = EXCLUDED.publication_date,
  title = EXCLUDED.title;

`;

    /*
      STORIES
    */

    sql += "-- Stories\n";

    sql += `
DELETE FROM stories
WHERE briefing_id = ${Number(b.id)};

`;

    for (const story of data.stories) {

      sql += `
INSERT INTO stories (
  briefing_id,
  category,
  headline,
  summary,
  content,
  practice_area,
  source_name,
  source_url,
  watch_next
)
VALUES (
  ${Number(story.briefing_id)},
  ${escapeSQL(story.category)},
  ${escapeSQL(story.headline)},
  ${escapeSQL(story.summary)},
  ${escapeSQL(story.content)},
  ${escapeSQL(story.practice_area)},
  ${escapeSQL(story.source_name)},
  ${escapeSQL(story.source_url)},
  ${escapeSQL(story.watch_next)}
);

`;
    }

    /*
      QUESTIONS
    */

    sql += "-- Questions\n";

    sql += `
DELETE FROM questions
WHERE briefing_id = ${Number(b.id)};

`;

    for (const question of data.questions) {

      sql += `
INSERT INTO questions (
  briefing_id,
  question,
  category,
  answer,
  question_type
)
VALUES (
  ${Number(question.briefing_id)},
  ${escapeSQL(question.question)},
  ${escapeSQL(question.category)},
  ${escapeSQL(question.answer)},
  ${escapeSQL(question.question_type)}
);

`;
    }

    sql += "-- End of cara dlí briefing import";

    output.value = sql;

    status.textContent =
      "✓ Import generated. Copy the SQL and run it in Supabase SQL Editor.";

  } catch (error) {

    status.textContent =
      "Error reading JSON: " + error.message;

  }
}

function copySQL() {

  const output = document.getElementById("sqlOutput");

  if (!output.value) {
    document.getElementById("status").textContent =
      "Generate the import first.";
    return;
  }

  navigator.clipboard.writeText(output.value);

  document.getElementById("status").textContent =
    "✓ SQL copied to clipboard.";
}

</script>

</body>
</html>
